<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <!-- SVG logo goes here -->
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="content-container">
        <main>
            <section class="contact-form">
                <h1>Contact Us</h1>
                <p>Add me on Linkedin or fill in the form.</p>
                <div id="error-summary" class="error-summary" style="display:none;" tabindex="-1">
                    <p>There is a problem</p>
                    <ul id="error-summary-list">
                        <!-- Error messages will be inserted here -->
                    </ul>
                </div>
                <div class="contact-form-container">
                    <form id="contact-form" action="https://formsubmit.co/ryan.gallacher2@gmail.com" method="POST" novalidate>
                        <div class="form-group">
                            <label for="email">Your email</label>
                            <input type="email" id="email" name="email">
                            <div id="email-error" class="error-message">Your email is required</div>
                        </div>

                        <div class="form-group">
                            <label for="message" class="message-label">Your message</label>
                            <textarea id="message" name="message" rows="4" maxlength="1000" style="height: 200px;"></textarea>
                            <div id="message-error" class="error-message">Your message is required</div>
                        </div>

                        <button type="submit">Send message</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <footer>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#work">Work</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <p>&copy; 2023 Ryan Gallacher. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();
            var email = document.getElementById('email');
            var message = document.getElementById('message');
            var emailError = document.getElementById('email-error');
            var messageError = document.getElementById('message-error');
            var errorSummary = document.getElementById('error-summary');
            var errorSummaryList = document.getElementById('error-summary-list');
            var hasError = false;

            // Reset error states
            emailError.style.display = 'none';
            messageError.style.display = 'none';
            errorSummary.style.display = 'none';
            errorSummaryList.innerHTML = '';

            // Validate form
            if (!email.value) {
                emailError.style.display = 'block';
                var emailErrorItem = document.createElement('li');
                emailErrorItem.innerHTML = '<a href="#email">Your email is required</a>';
                errorSummaryList.appendChild(emailErrorItem);
                hasError = true;
            }

            if (!message.value) {
                messageError.style.display = 'block';
                var messageErrorItem = document.createElement('li');
                messageErrorItem.innerHTML = '<a href="#message">Your message is required</a>';
                errorSummaryList.appendChild(messageErrorItem);
                hasError = true;
            }

            if (hasError) {
                errorSummary.style.display = 'block';
                errorSummary.focus();
                return;
            }

            // If validation passes, submit the form to Formspree
            this.submit();
        });
    </script>
</body>

</html>
